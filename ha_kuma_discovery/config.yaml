  homematic_ip_max_retries: int
  e3dc_ping_interval: int
  e3dc_max_retries: int
  overkiz_ping_interval: int
  overkiz_max_retries: int
  hue_ping_interval: int
  hue_max_retries: int
  smlight_ping_interval: int
