name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile ha_kuma_discovery/app.py ha_kuma_discovery/ha_client.py ha_kuma_discovery/integration_addons.py ha_kuma_discovery/integration_airgradient.py ha_kuma_discovery/integration_e3dc.py ha_kuma_discovery/integration_esphome.py ha_kuma_discovery/integration_fritz.py ha_kuma_discovery/integration_fully_kiosk.py ha_kuma_discovery/integration_homematic.py ha_kuma_discovery/integration_home_connect.py ha_kuma_discovery/integration_ecovacs.py ha_kuma_discovery/integration_hue.py ha_kuma_discovery/integration_matter.py ha_kuma_discovery/integration_mqtt.py ha_kuma_discovery/integration_overkiz.py ha_kuma_discovery/integration_shelly.py ha_kuma_discovery/integration_smlight.py ha_kuma_discovery/integration_stiebel_eltron.py ha_kuma_discovery/integration_synology.py ha_kuma_discovery/integration_unifi.py ha_kuma_discovery/kuma_monitor.py ha_kuma_discovery/option_loader.py ha_kuma_discovery/push_state.py ha_kuma_discovery/state_store.py
      - name: Check startup script
        run: bash -n ha_kuma_discovery/run.sh
      - name: Install test dependencies
        run: python -m pip install PyYAML==6.0.2 requests==2.32.5 websocket-client==1.8.0 uptime-kuma-api-ng==1.10.0
      - name: Behavior tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Validate metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          repo = yaml.safe_load(Path('repository.yaml').read_text())
          config = yaml.safe_load(Path('ha_kuma_discovery/config.yaml').read_text())
          assert repo['name']
          assert config['slug'] == 'ha_kuma_discovery'
          assert isinstance(config['version'], str)
          assert set(config['arch']) == {'amd64', 'aarch64'}
          assert set(config['options']) == set(config['schema'])
          assert not config['options']['kuma_username']
          assert not config['options']['kuma_password']
          print('Repository and add-on metadata OK')
          PY
